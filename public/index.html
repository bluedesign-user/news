<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建築ニュース - 建設業界の最新情報</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1><span class="icon">&#9962;</span> 建築ニュース</h1>
      <p class="subtitle">建設業界の最新ニュースをまとめてチェック</p>
    </div>
  </header>

  <nav id="category-nav">
    <div class="nav-inner">
      <button class="cat-btn active" data-category="all">すべて</button>
    </div>
  </nav>

  <main>
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>ニュースを取得中...</p>
    </div>
    <div id="error" class="error hidden">
      <p>ニュースの取得に失敗しました。再度お試しください。</p>
      <button onclick="loadAllNews()">再読み込み</button>
    </div>
    <div id="news-container"></div>
  </main>

  <footer>
    <p>建築ニュース &copy; 2026 | ニュースソース: Google News</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
